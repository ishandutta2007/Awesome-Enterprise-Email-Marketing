<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatParticle1 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }
    @keyframes floatParticle2 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(14px) translateX(-10px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes waveFlow {
      0% { transform: translateX(0); }
      50% { transform: translateX(-25px); }
      100% { transform: translateX(0); }
    }
    .orb-glow-1 {
      transform-origin: 150px 70px;
      animation: pulseGlow 8s ease-in-out infinite;
    }
    .orb-glow-2 {
      transform-origin: 750px 200px;
      animation: pulseGlow 10s ease-in-out infinite 2s;
    }
    .particle-1 { animation: floatParticle1 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle2 7s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle1 8s ease-in-out infinite 2.5s; }
    .pulse-line {
      stroke-dasharray: 8 6;
      animation: dashMove 14s linear infinite;
    }
    .flow-wave {
      animation: waveFlow 12s ease-in-out infinite;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .text-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      fill: #94a3b8;
    }
    .text-tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Container Box with Rounded Corners -->
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- DYNAMIC BACKGROUND LAYER (Strictly Behind Foreground) -->
  <g id="dynamic-background">
    <!-- Glowing Accent Orbs -->
    <circle class="orb-glow-1" cx="160" cy="80" r="110" fill="#38bdf8" opacity="0.18" filter="url(#glow)" />
    <circle class="orb-glow-2" cx="740" cy="190" r="130" fill="#a855f7" opacity="0.18" filter="url(#glow)" />

    <!-- Isometric Grid Lines in Background -->
    <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
      <line x1="0" y1="40" x2="900" y2="40" />
      <line x1="0" y1="90" x2="900" y2="90" />
      <line x1="0" y1="140" x2="900" y2="140" />
      <line x1="0" y1="190" x2="900" y2="190" />
      <line x1="0" y1="240" x2="900" y2="240" />
      <line x1="120" y1="0" x2="120" y2="280" />
      <line x1="280" y1="0" x2="280" y2="280" />
      <line x1="440" y1="0" x2="440" y2="280" />
      <line x1="600" y1="0" x2="600" y2="280" />
      <line x1="760" y1="0" x2="760" y2="280" />
    </g>

    <!-- Deliverability & Email Flow Wave Lines -->
    <path class="flow-wave" d="M-50,220 C180,180 320,250 520,200 C720,150 820,230 950,190" fill="none" stroke="url(#accentCyan)" stroke-width="2.5" opacity="0.35" />
    <path class="pulse-line" d="M-50,240 C160,200 340,270 540,220 C740,170 840,250 950,210" fill="none" stroke="url(#accentPurple)" stroke-width="1.8" opacity="0.4" />

    <!-- Floating Tech Particles -->
    <g class="particle-1">
      <circle cx="120" cy="180" r="4" fill="#38bdf8" opacity="0.6" filter="url(#softGlow)" />
      <circle cx="780" cy="70" r="3" fill="#818cf8" opacity="0.5" />
    </g>
    <g class="particle-2">
      <circle cx="820" cy="130" r="5" fill="#c084fc" opacity="0.6" filter="url(#softGlow)" />
      <circle cx="210" cy="220" r="3.5" fill="#38bdf8" opacity="0.5" />
    </g>
    <g class="particle-3">
      <circle cx="680" cy="50" r="3" fill="#34d399" opacity="0.5" />
      <circle cx="80" cy="90" r="3.5" fill="#a78bfa" opacity="0.6" />
    </g>
  </g>

  <!-- FOREGROUND LAYER: Content, Title, Subtitle & Interactive Pills (Never Obscured) -->
  <g id="foreground-content">
    <!-- Top Category Badges / Pills -->
    <g transform="translate(60, 36)">
      <!-- Pill 1: Enterprise MarTech -->
      <rect x="0" y="0" width="168" height="26" rx="13" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="14" cy="13" r="4" fill="#38bdf8" />
      <text class="text-tag" x="26" y="17" fill="#e2e8f0">ENTERPRISE ESP &amp; CRM</text>

      <!-- Pill 2: Open Source -->
      <rect x="180" y="0" width="170" height="26" rx="13" fill="url(#pillGrad1)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="194" cy="13" r="4" fill="#818cf8" />
      <text class="text-tag" x="206" y="17" fill="#e2e8f0">SELF-HOSTED STACK</text>

      <!-- Pill 3: Deliverability -->
      <rect x="362" y="0" width="180" height="26" rx="13" fill="url(#pillGrad1)" stroke="#34d399" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="376" cy="13" r="4" fill="#34d399" />
      <text class="text-tag" x="388" y="17" fill="#e2e8f0">SPF • DKIM • DMARC</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(60, 114)">
      <!-- Email Icon Frame -->
      <rect x="0" y="-30" width="48" height="48" rx="12" fill="url(#accentCyan)" filter="url(#softGlow)" opacity="0.9" />
      <path d="M12 -16 L24 -7 L36 -16 M12 -16 L36 -16 L36 4 L12 4 Z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Main Title Text -->
      <text class="text-title" x="64" y="5" font-size="34">Awesome Enterprise Email Marketing</text>
    </g>

    <!-- Subtitle -->
    <text class="text-subtitle" x="60" y="152" font-size="16">
      Curated Ecosystem of Enterprise SaaS Platforms &amp; Self-Hosted Open-Source Infrastructure
    </text>

    <!-- Bottom Feature Highlights -->
    <g transform="translate(60, 186)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <circle cx="6" cy="6" r="4" fill="#06b6d4" />
        <text class="text-subtitle" x="18" y="10" font-size="13" font-weight="600" fill="#cbd5e1">Campaign Automation</text>
      </g>
      <!-- Feature 2 -->
      <g transform="translate(195, 0)">
        <circle cx="6" cy="6" r="4" fill="#818cf8" />
        <text class="text-subtitle" x="18" y="10" font-size="13" font-weight="600" fill="#cbd5e1">Deliverability &amp; Warmup</text>
      </g>
      <!-- Feature 3 -->
      <g transform="translate(400, 0)">
        <circle cx="6" cy="6" r="4" fill="#ec4899" />
        <text class="text-subtitle" x="18" y="10" font-size="13" font-weight="600" fill="#cbd5e1">Audience Segmentation</text>
      </g>
      <!-- Feature 4 -->
      <g transform="translate(605, 0)">
        <circle cx="6" cy="6" r="4" fill="#10b981" />
        <text class="text-subtitle" x="18" y="10" font-size="13" font-weight="600" fill="#cbd5e1">Data Sovereignty</text>
      </g>
    </g>

    <!-- Bottom Metric Bar -->
    <g transform="translate(60, 226)">
      <rect x="0" y="0" width="780" height="28" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text class="text-tag" x="16" y="18" fill="#94a3b8">UPDATED FOR 2026</text>
      <text class="text-tag" x="175" y="18" fill="#64748b">•</text>
      <text class="text-tag" x="195" y="18" fill="#38bdf8">13+ ENTERPRISE SAAS PLATFORMS</text>
      <text class="text-tag" x="420" y="18" fill="#64748b">•</text>
      <text class="text-tag" x="440" y="18" fill="#a78bfa">19+ OPEN-SOURCE REPOSITORIES</text>
      <text class="text-tag" x="660" y="18" fill="#64748b">•</text>
      <text class="text-tag" x="680" y="18" fill="#34d399">MIT LICENSED</text>
    </g>
  </g>
</svg>
