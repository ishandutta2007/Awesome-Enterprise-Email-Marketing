<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="280" preserveAspectRatio="xMidYMid meet" viewBox="0 0 900 280"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="borderGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".4"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".8"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="pillGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".9"/><stop offset="100%" stop-color="#334155" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes floatParticle1{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-12px) translateX(8px)}}@keyframes floatParticle2{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(14px) translateX(-10px)}}@keyframes dashMove{0%{stroke-dashoffset:200}}@keyframes waveFlow{0%{transform:translateX(0)}50%{transform:translateX(-25px)}}.orb-glow-1{transform-origin:150px 70px;animation:pulseGlow 8s ease-in-out infinite}.orb-glow-2{transform-origin:750px 200px;animation:pulseGlow 10s ease-in-out infinite 2s}.particle-1{animation:floatParticle1 6s ease-in-out infinite}.particle-2{animation:floatParticle2 7s ease-in-out infinite 1s}.particle-3{animation:floatParticle1 8s ease-in-out infinite 2.5s}.pulse-line{stroke-dasharray:8 6;animation:dashMove 14s linear infinite}.flow-wave{animation:waveFlow 12s ease-in-out infinite}.text-title{font-weight:800;fill:#fff;letter-spacing:-.5px}.text-subtitle,.text-tag,.text-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.text-subtitle{font-weight:500;fill:#94a3b8}.text-tag{font-weight:600;font-size:11px;letter-spacing:.8px}</style><rect width="896" height="276" x="2" y="2" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" rx="16"/><g id="dynamic-background"><circle cx="160" cy="80" r="110" fill="#38bdf8" class="orb-glow-1" filter="url(#glow)" opacity=".18"/><circle cx="740" cy="190" r="130" fill="#a855f7" class="orb-glow-2" filter="url(#glow)" opacity=".18"/><g stroke="#94a3b8" stroke-width="1" opacity=".1"><line x1="0" x2="900" y1="40" y2="40"/><line x1="0" x2="900" y1="90" y2="90"/><line x1="0" x2="900" y1="140" y2="140"/><line x1="0" x2="900" y1="190" y2="190"/><line x1="0" x2="900" y1="240" y2="240"/><line x1="120" x2="120" y1="0" y2="280"/><line x1="280" x2="280" y1="0" y2="280"/><line x1="440" x2="440" y1="0" y2="280"/><line x1="600" x2="600" y1="0" y2="280"/><line x1="760" x2="760" y1="0" y2="280"/></g><path fill="none" stroke="url(#accentCyan)" stroke-width="2.5" d="M-50,220 C180,180 320,250 520,200 C720,150 820,230 950,190" class="flow-wave" opacity=".35"/><path fill="none" stroke="url(#accentPurple)" stroke-width="1.8" d="M-50,240 C160,200 340,270 540,220 C740,170 840,250 950,210" class="pulse-line" opacity=".4"/><g class="particle-1"><circle cx="120" cy="180" r="4" fill="#38bdf8" filter="url(#softGlow)" opacity=".6"/><ci